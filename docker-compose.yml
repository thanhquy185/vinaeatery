version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: vinaeatery_mysql
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vinaeatery
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  server:
    build: ./server
    container_name: vinaeatery_server
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_HOST: mysql
      SPRING_DATASOURCE_DATABASE: vinaeatery
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
    ports:
      - "8080:8080"

  client-web:
    build: ./client-web
    container_name: vinaeatery_client-web
    depends_on:
      - server
    ports:
      - "5173:5173"
