plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.tuhoc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
    maven { url "https://repo.spring.io/milestone" }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

dependencies {
    // Spring Boot core
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation("org.springframework.boot:spring-boot-starter-mail")
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign"
    // implementation "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client"
	implementation 'jakarta.validation:jakarta.validation-api:3.0.2' // Do jakarta.validation không tìm thấy trong starter-validation

    // Tomcat embedded - provided (runtime only)
    runtimeOnly 'org.springframework.boot:spring-boot-starter-tomcat'

    // Spring Cloudinary
    implementation 'com.cloudinary:cloudinary-http5:2.0.0'
    implementation 'io.github.cdimascio:dotenv-java:2.2.4'

    // Spring Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Spring config processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // MySQL JDBC Driver
    implementation 'com.mysql:mysql-connector-j:9.2.0'

    // Spring Security config
    implementation 'org.springframework.security:spring-security-config'

    // Hibernate JPA Metamodel Generator
    compileOnly 'org.hibernate.orm:hibernate-jpamodelgen:6.4.1.Final'
    annotationProcessor 'org.hibernate.orm:hibernate-jpamodelgen:6.4.1.Final'

    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // hoặc jjwt-gson nếu bạn muốn

	// Flyway
	// implementation 'org.flywaydb:flyway-core'
	// implementation 'org.flywaydb:flyway-mysql'

    // Zalo Pay
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.json:json:20230227'
    implementation files('lib/zalopay-sdk.jar')

    // OAuth2 Client (Google, Facebook Login)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
    }
}

tasks.named('test') {
	useJUnitPlatform()
}
